<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目管理 - C++ OJ</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
            white-space: nowrap;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-edit {
            background: rgba(245, 158, 11, 0.15);
            color: #F59E0B;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .btn-edit:hover {
            background: rgba(245, 158, 11, 0.25);
            border-color: #F59E0B;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: var(--error);
        }

        .admin-table {
            width: 100%;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .admin-table th,
        .admin-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .admin-table th {
            background: rgba(139, 92, 246, 0.08);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .admin-table tr:hover td {
            background: rgba(139, 92, 246, 0.03);
        }

        .admin-table td {
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .admin-table a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        .admin-table a:hover {
            color: var(--neon-cyan);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-bar input {
            flex: 1;
            max-width: 400px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            color: var(--text-muted);
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon svg {
            width: 24px;
            height: 24px;
        }

        .stat-icon.total {
            background: rgba(139, 92, 246, 0.15);
            color: var(--primary);
        }

        .stat-icon.easy {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .stat-icon.medium {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .stat-icon.hard {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .stat-info h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .table-container {
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                C++ OJ
            </a>
        </div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/problems.html">题目列表</a>
            <a href="/admin/problems.html" class="active">题目管理</a>
            <span id="nav-user"></span>
        </div>
    </nav>

    <div class="container">
        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-icon total">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3 id="stat-total">-</h3>
                    <p>题目总数</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon easy">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3 id="stat-easy">-</h3>
                    <p>简单</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon medium">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="8" y1="15" x2="16" y2="15"></line>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3 id="stat-medium">-</h3>
                    <p>中等</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon hard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3 id="stat-hard">-</h3>
                    <p>困难</p>
                </div>
            </div>
        </div>

        <div class="admin-header">
            <div class="page-title-group">
                <h1 class="page-title">题目管理</h1>
            </div>
            <a href="/admin/problem_edit.html" class="btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                新增题目
            </a>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="搜索题目标题...">
            <button class="btn-primary btn-sm" onclick="handleSearch()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                搜索
            </button>
        </div>

        <div class="table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>标题</th>
                        <th>难度</th>
                        <th>分类</th>
                        <th>时间/内存</th>
                        <th>测试用例</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="problems-tbody">
                    <tr><td colspan="7" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let currentPage = 1;
        let searchKeyword = '';
        let stats = { total: 0, easy: 0, medium: 0, hard: 0 };

        async function loadProblems() {
            const tbody = document.getElementById('problems-tbody');

            try {
                const result = await api.problems.list({
                    page: currentPage,
                    pageSize: 20,
                    search: searchKeyword
                });

                if (result.error) {
                    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">加载失败: ${result.error}</td></tr>`;
                    return;
                }

                calculateStats(result.problems || []);
                renderProblems(tbody, result.problems || []);
                renderPagination(result.page, result.totalPages, result.total);
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">加载失败: ${e.message}</td></tr>`;
            }
        }

        function calculateStats(problems) {
            stats = { total: problems.length, easy: 0, medium: 0, hard: 0 };
            problems.forEach(p => {
                if (p.difficulty === 'easy') stats.easy++;
                else if (p.difficulty === 'medium') stats.medium++;
                else if (p.difficulty === 'hard') stats.hard++;
            });
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-easy').textContent = stats.easy;
            document.getElementById('stat-medium').textContent = stats.medium;
            document.getElementById('stat-hard').textContent = stats.hard;
        }

        function renderProblems(tbody, problems) {
            if (problems.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无题目</td></tr>';
                return;
            }

            tbody.innerHTML = problems.map(p => {
                const difficultyText = { easy: '简单', medium: '中等', hard: '困难' }[p.difficulty] || p.difficulty;
                const difficultyClass = 'difficulty-' + p.difficulty;
                const tagsText = (p.tags || []).join(', ');

                return `
                    <tr>
                        <td style="color: var(--primary); font-family: 'Space Grotesk', monospace; font-weight: 600;">#${p.id}</td>
                        <td><a href="/problem.html?id=${p.id}">${escapeHtml(p.title)}</a></td>
                        <td><span class="difficulty ${difficultyClass}">${difficultyText}</span></td>
                        <td style="color: var(--text-secondary); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(tagsText) || '-'}</td>
                        <td style="color: var(--text-secondary); font-size: 0.85rem;">${p.time_limit_ms}ms<br>${p.memory_limit_mb}MB</td>
                        <td style="color: var(--text-secondary);"><span style="color: var(--accent);">${p.test_case_count}</span> 个</td>
                        <td class="actions">
                            <a href="/admin/problem_edit.html?id=${p.id}" class="btn-edit btn-sm">编辑</a>
                            <button class="btn-delete btn-sm" onclick="deleteProblem(${p.id}, '${escapeHtml(p.title.replace(/'/g, "\\'"))}')">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderPagination(page, totalPages, total) {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = `<div class="pagination-info">共 ${total} 题</div>`;
                return;
            }

            let html = `<div class="pagination-info">共 ${total} 题，第 ${page}/${totalPages} 页</div>`;
            html += '<div class="pagination-buttons">';

            if (page > 1) {
                html += `<button onclick="goToPage(${page - 1})">上一页</button>`;
            }

            const start = Math.max(1, page - 2);
            const end = Math.min(totalPages, page + 2);

            if (start > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (start > 2) html += '<span class="pagination-ellipsis">...</span>';
            }

            for (let i = start; i <= end; i++) {
                html += `<button onclick="goToPage(${i})" class="${i === page ? 'active' : ''}">${i}</button>`;
            }

            if (end < totalPages) {
                if (end < totalPages - 1) html += '<span class="pagination-ellipsis">...</span>';
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            if (page < totalPages) {
                html += `<button onclick="goToPage(${page + 1})">下一页</button>`;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadProblems();
            window.scrollTo(0, 0);
        }

        function handleSearch() {
            searchKeyword = document.getElementById('search-input').value.trim();
            currentPage = 1;
            loadProblems();
        }

        async function deleteProblem(id, title) {
            if (!confirm(`确定要删除题目 "${title}" 吗？\n此操作不可恢复。`)) {
                return;
            }

            try {
                const result = await api.problems.delete(id);
                if (result.error) {
                    alert('删除失败: ' + result.error);
                    return;
                }
                alert('删除成功');
                loadProblems();
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function initNav() {
            const result = await api.auth.me();
            const navUser = document.getElementById('nav-user');
            if (result && result.username) {
                if (result.role !== 'admin') {
                    alert('您没有管理员权限');
                    window.location.href = '/';
                    return;
                }
                navUser.innerHTML = `<span style="color: var(--accent);">${result.username}</span> | <a href="/logout.html" class="btn-logout" style="color: var(--error);">登出</a>`;
            } else {
                window.location.href = '/login.html';
            }
        }

        initNav();
        loadProblems();

        document.getElementById('search-input').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
