<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目管理 - C++ OJ</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* 第一行：标题独占一行 */
        .admin-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        /* 第二行：搜索框 + 新增按钮同一水平线 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
            white-space: nowrap;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            padding: 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.25);
            flex-shrink: 0;
        }

        .btn-icon:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        .btn-icon svg {
            width: 15px;
            height: 15px;
        }

        /* 编辑按钮：主色调（紫/蓝），不用黄色 */
        .btn-edit {
            background: rgba(139, 92, 246, 0.12);
            color: var(--primary);
            border: 1px solid rgba(139, 92, 246, 0.35);
        }

        .btn-edit:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 删除按钮：默认透明背景 + 红边框红字，hover 变红底白字 */
        .btn-delete {
            background: transparent;
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.45);
        }

        .btn-delete:hover {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }

        /* 表格操作列：按钮尺寸与间距统一 */
        .actions .btn-sm {
            min-width: 56px;
            text-align: center;
            font-weight: 600;
        }

        .admin-table {
            width: 100%;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .admin-table th,
        .admin-table td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .admin-table th {
            background: rgba(139, 92, 246, 0.08);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .admin-table tr:hover td {
            background: rgba(139, 92, 246, 0.03);
        }

        .admin-table td {
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .admin-table a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        .admin-table a:hover {
            color: var(--neon-cyan);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        /* 搜索条 + 标题放在同一行；搜索条限定宽度，新增按钮贴右 */
        .search-bar {
            margin-bottom: 0;
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px 4px 4px 16px;
            width: 360px;
            max-width: 360px;
            flex: 0 0 360px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-bar:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }

        .search-bar input {
            flex: 1;
            min-width: 0;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            color: var(--text-muted);
        }

        .stat-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;     /* 图标与数字垂直居中 */
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stat-icon svg {
            width: 24px;
            height: 24px;
        }

        .stat-icon.total {
            background: rgba(139, 92, 246, 0.15);
            color: var(--primary);
        }

        .stat-icon.easy {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .stat-icon.medium {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .stat-icon.hard {
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
        }

        .stat-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-info h3 {
            font-size: 1.85rem;       /* 数字字号加大 */
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
            margin: 0 0 4px 0;
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        .table-container {
            overflow-x: auto;
        }

        /* 表格分类列：最多展示 2 个标签 + "+N"，鼠标悬浮展示全部 */
        .tags-cell {
            max-width: 180px;
        }
        .tag-list {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-wrap: nowrap;
            overflow: hidden;
        }
        .tag-chip {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(139, 92, 246, 0.12);
            color: var(--primary);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 4px;
            font-size: 0.75rem;
            line-height: 1.4;
            white-space: nowrap;
        }
        .tag-more {
            display: inline-block;
            padding: 2px 7px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: help;
            white-space: nowrap;
        }
        .tag-more:hover {
            background: rgba(139, 92, 246, 0.15);
            color: var(--primary);
            border-color: rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                C++ OJ
            </a>
        </div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/problem_list.html">题目列表</a>
            <a href="/admin/problems.html" class="active">题目管理</a>
            <span id="nav-user"></span>
        </div>
    </nav>

    <div class="container">
        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-icon total">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3 id="stat-total">-</h3>
                    <p>题目总数</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon easy">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3 id="stat-easy">-</h3>
                    <p>简单</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon medium">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="8" y1="15" x2="16" y2="15"></line>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3 id="stat-medium">-</h3>
                    <p>中等</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon hard">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <div class="stat-info">
                    <h3 id="stat-hard">-</h3>
                    <p>困难</p>
                </div>
            </div>
        </div>

        <!-- 第一行：标题独占 -->
        <div class="admin-header">
            <h1 class="page-title">题目管理</h1>
        </div>

        <!-- 第二行：搜索框 + 新增按钮同一水平线 -->
        <div class="toolbar">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="搜索题目标题...">
                <button class="btn-icon" onclick="handleSearch()" title="搜索">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            <a href="/admin/problem_edit.html" class="btn-primary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                新增题目
            </a>
        </div>

        <div class="table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>标题</th>
                        <th>难度</th>
                        <th>分类</th>
                        <th>时间/内存</th>
                        <th>测试用例</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="problems-tbody">
                    <tr><td colspan="7" class="empty-state">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let currentPage = 1;
        let searchKeyword = '';
        let stats = { total: 0, easy: 0, medium: 0, hard: 0 };

        async function loadProblems() {
            const tbody = document.getElementById('problems-tbody');

            try {
                const result = await api.problems.list({
                    page: currentPage,
                    pageSize: 20,
                    search: searchKeyword
                });

                if (result.error) {
                    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">加载失败: ${result.error}</td></tr>`;
                    return;
                }

                calculateStats(result.problems || []);
                renderProblems(tbody, result.problems || []);
                renderPagination(result.page, result.totalPages, result.total);
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">加载失败: ${e.message}</td></tr>`;
            }
        }

        function calculateStats(problems) {
            stats = { total: problems.length, easy: 0, medium: 0, hard: 0 };
            problems.forEach(p => {
                if (p.difficulty === 'easy') stats.easy++;
                else if (p.difficulty === 'medium') stats.medium++;
                else if (p.difficulty === 'hard') stats.hard++;
            });
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-easy').textContent = stats.easy;
            document.getElementById('stat-medium').textContent = stats.medium;
            document.getElementById('stat-hard').textContent = stats.hard;
        }

        function renderProblems(tbody, problems) {
            if (problems.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">暂无题目</td></tr>';
                return;
            }

            tbody.innerHTML = problems.map(p => {
                const difficultyText = { easy: '简单', medium: '中等', hard: '困难' }[p.difficulty] || p.difficulty;
                const difficultyClass = 'difficulty-' + p.difficulty;
                const tags = p.tags || [];
                const MAX_TAGS = 2;
                const visibleTags = tags.slice(0, MAX_TAGS).map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('');
                const overflowCount = tags.length - MAX_TAGS;
                const overflowHtml = overflowCount > 0
                    ? `<span class="tag-more" title="${escapeHtml(tags.join(', '))}">+${overflowCount}</span>`
                    : '';
                const tagsCell = tags.length === 0
                    ? '<span style="color: var(--text-muted);">-</span>'
                    : `<div class="tag-list">${visibleTags}${overflowHtml}</div>`;

                return `
                    <tr>
                        <td style="color: var(--primary); font-family: 'Space Grotesk', monospace; font-weight: 600;">#${p.id}</td>
                        <td><a href="/problem.html?id=${p.id}">${escapeHtml(p.title)}</a></td>
                        <td><span class="difficulty ${difficultyClass}">${difficultyText}</span></td>
                        <td class="tags-cell">${tagsCell}</td>
                        <td style="color: var(--text-secondary); font-size: 0.85rem;">${p.time_limit_ms}ms<br>${p.memory_limit_mb}MB</td>
                        <td style="color: var(--text-secondary);"><span style="color: var(--accent);">${p.test_case_count}</span> 个</td>
                        <td class="actions">
                            <a href="/admin/problem_edit.html?id=${p.id}" class="btn-edit btn-sm">编辑</a>
                            <button class="btn-delete btn-sm" onclick="deleteProblem(${p.id}, '${escapeHtml(p.title.replace(/'/g, "\\'"))}')">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderPagination(page, totalPages, total) {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = `<div class="pagination-info">共 ${total} 题</div>`;
                return;
            }

            let html = `<div class="pagination-info">共 ${total} 题，第 ${page}/${totalPages} 页</div>`;
            html += '<div class="pagination-buttons">';

            if (page > 1) {
                html += `<button onclick="goToPage(${page - 1})">上一页</button>`;
            }

            const start = Math.max(1, page - 2);
            const end = Math.min(totalPages, page + 2);

            if (start > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (start > 2) html += '<span class="pagination-ellipsis">...</span>';
            }

            for (let i = start; i <= end; i++) {
                html += `<button onclick="goToPage(${i})" class="${i === page ? 'active' : ''}">${i}</button>`;
            }

            if (end < totalPages) {
                if (end < totalPages - 1) html += '<span class="pagination-ellipsis">...</span>';
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            if (page < totalPages) {
                html += `<button onclick="goToPage(${page + 1})">下一页</button>`;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadProblems();
            window.scrollTo(0, 0);
        }

        function handleSearch() {
            searchKeyword = document.getElementById('search-input').value.trim();
            currentPage = 1;
            loadProblems();
        }

        async function deleteProblem(id, title) {
            if (!confirm(`确定要删除题目 "${title}" 吗？\n此操作不可恢复。`)) {
                return;
            }

            try {
                const result = await api.problems.delete(id);
                if (result.error) {
                    alert('删除失败: ' + result.error);
                    return;
                }
                alert('删除成功');
                loadProblems();
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function initNav() {
            const result = await api.auth.me();
            const navUser = document.getElementById('nav-user');
            if (result && result.username) {
                if (result.role !== 'admin') {
                    alert('您没有管理员权限');
                    window.location.href = '/';
                    return;
                }
                navUser.innerHTML = `<a href="account.html" class="nav-user-link">${result.username}</a> | <button type="button" class="btn-logout" onclick="logout()">登出</button>`;
            } else {
                window.location.href = '/login.html';
            }
        }

        initNav();
        loadProblems();

        document.getElementById('search-input').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>
