<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">新增题目 - C++ OJ 管理后台</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .form-container {
            background: var(--bg-card);
            padding: 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
            max-width: 900px;
            margin: 0 auto;
        }

        .form-section {
            margin-bottom: 32px;
        }

        .form-section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-section-title svg {
            width: 18px;
            height: 18px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-group label .required {
            color: var(--error);
            margin-left: 2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--text-muted);
        }

        .form-group textarea {
            min-height: 180px;
            resize: vertical;
            font-family: 'Space Grotesk', monospace;
            line-height: 1.6;
        }

        .form-group small {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-top: 6px;
            display: block;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }

        .tag-input-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            min-height: 48px;
            background: var(--bg-input);
            transition: all 0.2s;
        }

        .tag-input-container:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
        }

        .tag-input-container .tag {
            background: rgba(139, 92, 246, 0.15);
            color: var(--secondary);
            padding: 6px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            border: 1px solid rgba(139, 92, 246, 0.25);
        }

        .tag-input-container .tag-remove {
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .tag-input-container .tag-remove:hover {
            opacity: 1;
        }

        .tag-input-container input {
            border: none;
            outline: none;
            flex: 1;
            min-width: 120px;
            padding: 6px;
            background: transparent;
            color: var(--text-primary);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            color: var(--text-muted);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .error-message svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .testcase-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .testcase-upload {
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
            padding: 20px;
            background: rgba(139, 92, 246, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .testcase-upload .form-group {
            margin-bottom: 0;
            flex: 1;
            min-width: 180px;
        }

        .testcase-upload label {
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            display: block;
        }

        .testcase-upload input[type="file"] {
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .testcase-upload .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
        }

        .testcase-upload .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .testcase-upload .checkbox-group label {
            margin-bottom: 0;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .testcase-list {
            list-style: none;
        }

        .testcase-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        .testcase-list li:hover {
            border-color: var(--text-muted);
        }

        .testcase-list li .tc-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .testcase-list li .tc-info span {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .testcase-list li .tc-info .tc-index {
            color: var(--primary);
            font-family: 'Space Grotesk', monospace;
            font-weight: 600;
        }

        .testcase-list li .tc-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .testcase-list li .btn-delete-tc {
            padding: 6px 14px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .testcase-list li .btn-delete-tc:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: var(--error);
        }

        .empty-tc {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-row-2 {
                grid-template-columns: 1fr;
            }
            .testcase-upload {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                C++ OJ
            </a>
        </div>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/problem_list.html">题目列表</a>
            <a href="/admin/problems.html">题目管理</a>
            <span id="nav-user"></span>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title" id="form-title">新增题目</h1>
            <a href="/admin/problems.html" class="btn btn-secondary">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回列表
            </a>
        </div>

        <div id="loading" class="loading">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 6v6l4 2"></path>
            </svg>
            <p>加载中...</p>
        </div>
        <div id="error" class="error-message" style="display: none;"></div>

        <div class="form-container" id="form-container" style="display: none;">
            <form id="problem-form">
                <div class="form-section">
                    <div class="form-section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                        基础信息
                    </div>
                    <div class="form-group">
                        <label for="title">题目标题 <span class="required">*</span></label>
                        <input type="text" id="title" name="title" required maxlength="200" placeholder="请输入题目标题">
                    </div>
                    <div class="form-group">
                        <label for="description">题目描述 <span class="required">*</span></label>
                        <textarea id="description" name="description" required placeholder="支持 Markdown 格式，支持代码块、列表等"></textarea>
                        <small>题目描述应清晰明确，包含输入输出格式说明和示例</small>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        题目设置
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="difficulty">难度等级 <span class="required">*</span></label>
                            <select id="difficulty" name="difficulty" required>
                                <option value="easy">简单</option>
                                <option value="medium">中等</option>
                                <option value="hard">困难</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="time_limit_ms">时间限制</label>
                            <input type="number" id="time_limit_ms" name="time_limit_ms" value="1000" min="100" max="60000">
                        </div>
                        <div class="form-group">
                            <label for="memory_limit_mb">内存限制</label>
                            <input type="number" id="memory_limit_mb" name="memory_limit_mb" value="256" min="16" max="1024">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>分类标签</label>
                        <div class="tag-input-container" id="tags-container">
                            <input type="text" id="tag-input" placeholder="输入标签后按回车添加">
                        </div>
                        <small>支持的标签：算法、数据结构、字符串、数组、动态规划、图论、数学、搜索、排序、贪心</small>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/admin/problems.html" class="btn btn-secondary">取消</a>
                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        保存题目
                    </button>
                </div>
            </form>

            <div class="testcase-section" id="testcase-section" style="display: none;">
                <div class="form-section-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    测试用例管理
                </div>

                <div class="testcase-upload">
                    <div class="form-group">
                        <label for="input-file">输入文件</label>
                        <input type="file" id="input-file" accept=".in,.txt,input/*">
                    </div>
                    <div class="form-group">
                        <label for="output-file">输出文件</label>
                        <input type="file" id="output-file" accept=".out,.txt,output/*">
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="is-sample">
                        <label for="is-sample">示例测试点</label>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="uploadTestCase()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        上传
                    </button>
                </div>

                <ul class="testcase-list" id="testcase-list">
                    <li class="empty-tc">暂无测试用例</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const ALL_TAGS = ['算法', '数据结构', '字符串', '数组', '动态规划', '图论', '数学', '搜索', '排序', '贪心'];
        let currentTags = [];
        let editProblemId = null;
        let testCases = [];

        function getProblemIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        async function initPage() {
            const user = await api.auth.me();
            if (!user || user.role !== 'admin') {
                alert('您没有管理员权限');
                window.location.href = '/';
                return;
            }

            const navUser = document.getElementById('nav-user');
            navUser.innerHTML = `<span style="color: var(--accent);">${user.username}</span> | <button type="button" class="btn-logout" onclick="logout()">登出</button>`;

            editProblemId = getProblemIdFromUrl();

            if (editProblemId) {
                document.getElementById('page-title').textContent = '编辑题目 - C++ OJ 管理后台';
                document.getElementById('form-title').textContent = '编辑题目';
                document.getElementById('testcase-section').style.display = 'block';
                await loadProblem(editProblemId);
                await loadTestCases(editProblemId);
            } else {
                document.getElementById('page-title').textContent = '新增题目 - C++ OJ 管理后台';
                document.getElementById('form-title').textContent = '新增题目';
                initTagInput();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('form-container').style.display = 'block';
            }
        }

        async function loadProblem(id) {
            try {
                const result = await api.problems.get(id);
                if (result.error) {
                    showError('加载题目失败: ' + result.error);
                    return;
                }

                document.getElementById('title').value = result.title || '';
                document.getElementById('description').value = result.description || '';
                document.getElementById('difficulty').value = result.difficulty || 'easy';
                document.getElementById('time_limit_ms').value = result.time_limit_ms || 1000;
                document.getElementById('memory_limit_mb').value = result.memory_limit_mb || 256;

                currentTags = result.tags || [];
                initTagInput();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('form-container').style.display = 'block';
            } catch (e) {
                showError('加载题目失败: ' + e.message);
            }
        }

        async function loadTestCases(problemId) {
            try {
                const result = await api.problems.getTestCases(problemId);
                if (result.error) {
                    console.error('加载测试用例失败:', result.error);
                    return;
                }
                testCases = result.test_cases || [];
                renderTestCases();
            } catch (e) {
                console.error('加载测试用例失败:', e);
            }
        }

        function renderTestCases() {
            const list = document.getElementById('testcase-list');
            if (testCases.length === 0) {
                list.innerHTML = '<li class="empty-tc">暂无测试用例</li>';
                return;
            }

            list.innerHTML = testCases.map((tc, index) => `
                <li>
                    <div class="tc-info">
                        <span class="tc-index">#${index + 1}</span>
                        <span>ID: ${tc.id}</span>
                        <span>分值: ${tc.score}</span>
                        ${tc.is_sample ? '<span class="tc-badge">示例</span>' : ''}
                    </div>
                    <button class="btn-delete-tc" onclick="deleteTestCase(${tc.id})">删除</button>
                </li>
            `).join('');
        }

        async function uploadTestCase() {
            if (!editProblemId) {
                alert('请先保存题目后再上传测试用例');
                return;
            }

            const inputFile = document.getElementById('input-file').files[0];
            const outputFile = document.getElementById('output-file').files[0];
            const isSample = document.getElementById('is-sample').checked;

            if (!inputFile || !outputFile) {
                alert('请选择输入和输出文件');
                return;
            }

            try {
                const result = await api.testCases.add(editProblemId, inputFile, outputFile, isSample);
                if (result.error) {
                    alert('上传失败: ' + result.error);
                    return;
                }

                alert('上传成功');
                document.getElementById('input-file').value = '';
                document.getElementById('output-file').value = '';
                document.getElementById('is-sample').checked = false;

                await loadTestCases(editProblemId);
            } catch (e) {
                alert('上传失败: ' + e.message);
            }
        }

        async function deleteTestCase(id) {
            if (!confirm('确定要删除这个测试用例吗？')) {
                return;
            }

            try {
                const result = await api.testCases.delete(id);
                if (result.error) {
                    alert('删除失败: ' + result.error);
                    return;
                }

                alert('删除成功');
                await loadTestCases(editProblemId);
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }

        function initTagInput() {
            const container = document.getElementById('tags-container');
            const input = document.getElementById('tag-input');

            container.innerHTML = '';
            currentTags.forEach(tag => addTagElement(tag));
            container.appendChild(input);

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const tag = input.value.trim();
                    if (tag && !currentTags.includes(tag)) {
                        currentTags.push(tag);
                        addTagElement(tag);
                    }
                    input.value = '';
                }
            });

            container.addEventListener('click', (e) => {
                if (e.target.classList.contains('tag-remove')) {
                    const tag = e.target.parentElement.dataset.tag;
                    currentTags = currentTags.filter(t => t !== tag);
                    e.target.parentElement.remove();
                }
            });
        }

        function addTagElement(tag) {
            const container = document.getElementById('tags-container');
            const input = document.getElementById('tag-input');

            const tagEl = document.createElement('span');
            tagEl.className = 'tag';
            tagEl.dataset.tag = tag;
            tagEl.innerHTML = `${tag}<span class="tag-remove">&times;</span>`;
            container.insertBefore(tagEl, input);
        }

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                ${message}
            `;
            errorEl.style.display = 'flex';
            document.getElementById('loading').style.display = 'none';
        }

        document.getElementById('problem-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim(),
                difficulty: document.getElementById('difficulty').value,
                time_limit_ms: parseInt(document.getElementById('time_limit_ms').value) || 1000,
                memory_limit_mb: parseInt(document.getElementById('memory_limit_mb').value) || 256,
                tags: currentTags
            };

            if (!data.title) {
                alert('请输入题目标题');
                return;
            }
            if (!data.description) {
                alert('请输入题目描述');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"></path>
                </svg>
                保存中...
            `;

            try {
                let result;
                if (editProblemId) {
                    result = await api.problems.update(editProblemId, data);
                } else {
                    result = await api.problems.create(data);
                }

                if (result.error) {
                    alert('保存失败: ' + result.error);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        保存题目
                    `;
                    return;
                }

                if (!editProblemId && result.id) {
                    editProblemId = result.id;
                    document.getElementById('testcase-section').style.display = 'block';
                    history.replaceState(null, '', '?id=' + editProblemId);
                }

                alert(editProblemId ? '更新成功' : '创建成功');
                if (!editProblemId) {
                    window.location.href = '/admin/problems.html';
                }
            } catch (e) {
                alert('保存失败: ' + e.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    保存题目
                `;
            }
        });

        const style = document.createElement('style');
        style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
        document.head.appendChild(style);

        initPage();
    </script>
</body>
</html>
