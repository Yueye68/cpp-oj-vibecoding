<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目详情 - C++ OJ</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .problem-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .problem-detail {
                grid-template-columns: 1fr;
            }
        }

        .problem-left {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .problem-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .problem-info {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .problem-info h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .problem-info .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .description-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            overflow: auto;
            max-height: 400px;
        }

        .description-box h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .description-content {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .description-content pre {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
            overflow-x: auto;
            font-family: 'Space Grotesk', monospace;
            font-size: 0.875rem;
        }

        .description-content code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Space Grotesk', monospace;
            font-size: 0.875rem;
            color: var(--accent);
        }

        .description-content pre code {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
        }

        .example-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
        }

        .example-box h4 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .example-box pre {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            font-family: 'Space Grotesk', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 6px 0;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .editor-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .editor-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .editor-wrapper {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .CodeMirror {
            height: 350px !important;
            font-size: 14px !important;
            font-family: 'Space Grotesk', 'Consolas', monospace !important;
            flex: 1;
        }

        .CodeMirror-gutters {
            background: var(--bg-card) !important;
            border-right: 1px solid var(--border) !important;
        }

        .CodeMirror-linenumber {
            color: var(--text-muted) !important;
        }

        .cm-s-monokai .CodeMirror-cursor {
            border-left: 2px solid var(--accent) !important;
        }

        .cm-s-monokai .CodeMirror-selected {
            background: rgba(139, 92, 246, 0.3) !important;
        }

        .cm-s-monokai .cm-keyword { color: #F92672 !important; }
        .cm-s-monokai .cm-atom { color: #AE81FF !important; }
        .cm-s-monokai .cm-number { color: #AE81FF !important; }
        .cm-s-monokai .cm-def { color: #A6E22E !important; }
        .cm-s-monokai .cm-variable { color: #F8F8F2 !important; }
        .cm-s-monokai .cm-variable-2 { color: #F8F8F2 !important; }
        .cm-s-monokai .cm-variable-3 { color: #66D9EF !important; }
        .cm-s-monokai .cm-property { color: #66D9EF !important; }
        .cm-s-monokai .cm-comment { color: #75715E !important; }
        .cm-s-monokai .cm-string { color: #E6DB74 !important; }
        .cm-s-monokai .cm-string-2 { color: #E6DB74 !important; }
        .cm-s-monokai .cm-operator { color: #F92672 !important; }
        .cm-s-monokai .cm-bracket { color: #F8F8F2 !important; }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            gap: 12px;
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .draft-indicator {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .draft-indicator.saved {
            color: var(--success);
        }

        .result-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .result-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .result-status {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 700;
            font-family: 'Space Grotesk', monospace;
            letter-spacing: 1px;
        }

        .result-status.AC {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .result-status.WA {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .result-status.CE {
            background: rgba(139, 92, 246, 0.15);
            color: #8B5CF6;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .result-status.RE {
            background: rgba(245, 158, 11, 0.15);
            color: #F59E0B;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .result-status.TLE {
            background: rgba(236, 72, 153, 0.15);
            color: #EC4899;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .result-status.MLE {
            background: rgba(14, 165, 233, 0.15);
            color: #0EA5E9;
            border: 1px solid rgba(14, 165, 233, 0.3);
        }

        .result-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .result-meta-item {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .result-meta-item span {
            color: var(--text-primary);
            font-weight: 600;
            font-family: 'Space Grotesk', monospace;
        }

        .test-results {
            max-height: 300px;
            overflow-y: auto;
        }

        .test-case-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .test-case-item:last-child {
            margin-bottom: 0;
        }

        .test-case-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .test-case-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .test-case-status {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'Space Grotesk', monospace;
        }

        .test-case-status.AC {
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
        }

        .test-case-status.WA, .test-case-status.RE, .test-case-status.TLE, .test-case-status.MLE {
            background: rgba(239, 68, 68, 0.15);
            color: #EF4444;
        }

        .test-case-details {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .test-case-details pre {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            margin: 6px 0;
            font-family: 'Space Grotesk', monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .test-case-details .detail-row {
            display: flex;
            gap: 16px;
            margin-top: 6px;
        }

        .error-detail {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }

        .error-detail h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: #FCA5A5;
            margin-bottom: 8px;
        }

        .error-detail pre {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-family: 'Space Grotesk', monospace;
            font-size: 0.8rem;
            color: #FCA5A5;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        .login-prompt {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
        }

        .login-prompt p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .error-state {
            color: var(--error);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                C++ OJ
            </a>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="index.html">首页</a>
            <a href="problems.html">题目</a>
            <a href="login.html">登录</a>
            <a href="register.html">注册</a>
        </div>
    </nav>

    <div class="container">
        <div id="content"></div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let editor = null;
        let problemId = null;
        let currentUser = null;
        let lastSubmissionId = null;
        let autoSaveTimer = null;

        const DEFAULT_CODE = `#include <iostream>
using namespace std;

int main() {
    // 你的代码
    return 0;
}`;

        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('nav-links').innerHTML = `
                        <a href="index.html">首页</a>
                        <a href="problems.html">题目</a>
                        <a href="submissions.html">提交</a>
                        <span>${currentUser.username}</span>
                        <a href="/logout.html" class="btn-logout">登出</a>
                    `;
                }
            } catch (err) {
                console.log('Not logged in');
            }
            return currentUser;
        }

        async function loadProblem() {
            const params = new URLSearchParams(window.location.search);
            problemId = params.get('id');

            if (!problemId) {
                showError('缺少题目ID参数');
                return;
            }

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading-state">加载中...</div>';

            try {
                const result = await api.problems.get(problemId);
                if (result.error) {
                    showError(result.error);
                    return;
                }

                renderProblem(result);
                initEditor();
                loadDraft();
                startAutoSave();
            } catch (e) {
                showError(e.message);
            }
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div class="error-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;margin-bottom:16px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p>${escapeHtml(message)}</p>
                    <a href="problems.html" class="btn btn-primary" style="margin-top:16px;">返回题目列表</a>
                </div>
            `;
        }

        function renderProblem(problem) {
            const difficultyClass = 'difficulty-' + problem.difficulty;
            const difficultyText = { easy: '简单', medium: '中等', hard: '困难' }[problem.difficulty] || problem.difficulty;
            const tagsHtml = (problem.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');

            const examples = problem.examples || [];
            let examplesHtml = '';
            if (examples.length > 0) {
                examplesHtml = examples.map((ex, i) => `
                    <div class="example-box">
                        <h4>示例 ${i + 1}</h4>
                        <div><strong>输入:</strong></div>
                        <pre>${escapeHtml(ex.input || '无')}</pre>
                        <div><strong>输出:</strong></div>
                        <pre>${escapeHtml(ex.output || '无')}</pre>
                        ${ex.explanation ? `<div><strong>说明:</strong></div><pre>${escapeHtml(ex.explanation)}</pre>` : ''}
                    </div>
                `).join('');
            }

            const descriptionHtml = problem.description ? marked.parse(problem.description) : '<p>暂无描述</p>';

            document.getElementById('content').innerHTML = `
                <div class="page-header">
                    <h1>题目详情</h1>
                </div>
                <div class="problem-detail">
                    <div class="problem-left">
                        <div class="problem-info">
                            <h2>${escapeHtml(problem.title)}</h2>
                            <div class="meta">
                                <span class="difficulty ${difficultyClass}">${difficultyText}</span>
                                ${tagsHtml}
                                <span style="color:var(--text-muted);font-size:0.8rem;">时间限制: ${problem.time_limit_ms || 1000}ms | 内存限制: ${problem.memory_limit_mb || 256}MB</span>
                            </div>
                        </div>
                        <div class="description-box">
                            <h3>题目描述</h3>
                            <div class="description-content">${descriptionHtml}</div>
                        </div>
                        ${examplesHtml}
                    </div>
                    <div class="problem-right">
                        ${!currentUser ? `
                            <div class="login-prompt">
                                <p>请先登录后提交代码</p>
                                <a href="login.html?redirect=${encodeURIComponent(window.location.href)}" class="btn btn-primary">登录</a>
                            </div>
                        ` : `
                            <div class="editor-box">
                                <div class="editor-header">
                                    <h3>代码编辑器</h3>
                                    <span style="font-size:0.8rem;color:var(--text-muted);">C++ (g++ -O2)</span>
                                </div>
                                <div class="editor-wrapper">
                                    <textarea id="code-editor"></textarea>
                                </div>
                                <div class="editor-footer">
                                    <div class="draft-indicator" id="draft-indicator">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
                                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                            <polyline points="7 3 7 8 15 8"></polyline>
                                        </svg>
                                        <span id="draft-text">草稿已保存</span>
                                    </div>
                                    <button class="btn-submit" id="submit-btn" onclick="submitCode()">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                        </svg>
                                        提交代码
                                    </button>
                                </div>
                            </div>
                            <div id="result-panel"></div>
                        `}
                    </div>
                </div>
            `;

            if (lastSubmissionId) {
                loadSubmissionResult(lastSubmissionId);
            }
        }

        function initEditor() {
            editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                mode: "text/x-c++src",
                theme: "monokai",
                lineNumbers: true,
                matchBrackets: true,
                indentUnit: 4,
                tabSize: 4,
                indentWithTabs: false,
                lineWrapping: true,
                autofocus: true
            });
            editor.setSize(null, 350);
        }

        function getEditorValue() {
            return editor ? editor.getValue() : '';
        }

        function setEditorValue(code) {
            if (editor) {
                editor.setValue(code, -1);
            }
        }

        function getDraftKey() {
            return `oj_draft_${problemId}`;
        }

        function loadDraft() {
            if (!editor) return;
            const draft = localStorage.getItem(getDraftKey());
            if (draft) {
                setEditorValue(draft);
            } else {
                setEditorValue(DEFAULT_CODE);
            }
        }

        function saveDraft() {
            if (!editor) return;
            const code = getEditorValue();
            localStorage.setItem(getDraftKey(), code);
            showDraftStatus('已保存 ' + new Date().toLocaleTimeString(), true);
        }

        function clearDraft() {
            localStorage.removeItem(getDraftKey());
        }

        function startAutoSave() {
            if (autoSaveTimer) clearInterval(autoSaveTimer);
            autoSaveTimer = setInterval(saveDraft, 30000);
        }

        function showDraftStatus(text, saved = false) {
            const indicator = document.getElementById('draft-indicator');
            const draftText = document.getElementById('draft-text');
            if (indicator && draftText) {
                draftText.textContent = text;
                indicator.className = 'draft-indicator' + (saved ? ' saved' : '');
            }
        }

        async function submitCode() {
            if (!editor) return;

            const code = getEditorValue().trim();
            if (!code) {
                alert('请输入代码');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;animation:spin 1s linear infinite;">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"/>
                </svg> 提交中...
            `;

            try {
                const result = await api.submissions.create({
                    problem_id: parseInt(problemId),
                    code: code,
                    language: 'cpp'
                });

                if (result.error) {
                    alert(result.error);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        提交代码
                    `;
                    return;
                }

                clearDraft();
                lastSubmissionId = result.id;
                await loadSubmissionResult(result.id);
            } catch (e) {
                alert('提交失败: ' + e.message);
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                提交代码
            `;
        }

        async function loadSubmissionResult(submissionId) {
            const resultPanel = document.getElementById('result-panel');
            if (!resultPanel) return;

            resultPanel.innerHTML = '<div class="loading" style="padding:20px;text-align:center;">加载结果中...</div>';

            try {
                const result = await api.submissions.get(submissionId);
                if (result.error) {
                    resultPanel.innerHTML = '';
                    return;
                }
                renderResult(result);
            } catch (e) {
                resultPanel.innerHTML = '';
            }
        }

        function renderResult(submission) {
            const resultPanel = document.getElementById('result-panel');
            if (!resultPanel) return;

            const statusClass = submission.status;
            const statusText = {
                'AC': '答案正确',
                'WA': '答案错误',
                'CE': '编译错误',
                'RE': '运行时错误',
                'TLE': '超时',
                'MLE': '内存超限',
                'OLE': '输出超限',
                'PE': '格式错误'
            }[submission.status] || submission.status;

            let errorHtml = '';
            if (submission.error_detail) {
                errorHtml = `
                    <div class="error-detail">
                        <h4>错误详情</h4>
                        <pre>${escapeHtml(submission.error_detail)}</pre>
                    </div>
                `;
            }

            let testResultsHtml = '';
            if (submission.results && submission.results.length > 0) {
                testResultsHtml = `
                    <div class="test-results">
                        ${submission.results.map((r, i) => `
                            <div class="test-case-item">
                                <div class="test-case-header">
                                    <span class="test-case-title">测试点 ${i + 1}</span>
                                    <span class="test-case-status ${r.status}">${r.status}</span>
                                </div>
                                <div class="test-case-details">
                                    <div class="detail-row">
                                        <span>执行时间: <span style="color:var(--text-primary);">${r.execute_time_ms || 0}ms</span></span>
                                        <span>内存: <span style="color:var(--text-primary);">${r.execute_memory_kb || 0}KB</span></span>
                                    </div>
                                    ${r.status !== 'AC' && r.expected_output ? `
                                        <div style="margin-top:8px;">
                                            <div>期望输出:</div>
                                            <pre>${escapeHtml(r.expected_output)}</pre>
                                            <div>实际输出:</div>
                                            <pre>${escapeHtml(r.actual_output || '(空)')}</pre>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            resultPanel.innerHTML = `
                <div class="result-panel">
                    <div class="result-header">
                        <h3>评测结果</h3>
                        <span class="result-status ${statusClass}">${submission.status} - ${statusText}</span>
                    </div>
                    <div class="result-meta">
                        <div class="result-meta-item">执行时间: <span>${submission.execute_time_ms || 0}ms</span></div>
                        <div class="result-meta-item">内存占用: <span>${submission.execute_memory_kb || 0}KB</span></div>
                        <div class="result-meta-item">提交时间: <span>${formatTime(submission.created_at)}</span></div>
                    </div>
                    ${errorHtml}
                    ${testResultsHtml}
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const d = new Date(timeStr);
            return d.toLocaleString('zh-CN');
        }

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (editor && currentUser) {
                    saveDraft();
                }
            }
        });

        checkAuth().then(() => loadProblem());

        const style = document.createElement('style');
        style.textContent = '@keyframes spin { to { transform: rotate(360deg); } } .spinner { animation: spin 1s linear infinite; }';
        document.head.appendChild(style);
    </script>
</body>
</html>
