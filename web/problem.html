<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目详情 - C++ OJ</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* === 全局：固定整页高度，禁止 body 自身滚动 === */
        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
        }
        *, *::before, *::after { box-sizing: border-box; }

        /* body 改成 flex 列布局，导航栏占自然高度，剩余高度给题目页 */
        body {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 保持导航栏不参与滚动 */
        .navbar {
            flex: 0 0 auto;
        }

        /* === 主页面：flex 撑满导航栏以下所有视口高度 === */
        .problem-page {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            width: 100%;
            overflow: hidden;
        }

        /* #content 作为 .problem-page 的唯一子节点，必须撑满全部宽度 */
        #content {
            flex: 1 1 auto;
            width: 100%;
            min-width: 0;
            min-height: 0;
            display: flex;
        }

        /* === 左右分栏：flex 横向布局，撑满 100% 宽度 === */
        .problem-detail {
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--border);
            gap: 1px;
        }

        @media (max-width: 1024px) {
            .problem-detail {
                flex-direction: column;
            }
        }

        /* === 左右两栏：flex 列，禁止自身溢出滚动 === */
        .problem-left,
        .problem-right {
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
            min-height: 0;
            min-width: 0;
            height: 100%;
        }
        .problem-left  { flex: 3 1 0; }
        .problem-right {
            flex: 2 1 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* 题目头部（标题/标签），固定不滚动 */
        .problem-info {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
            background: var(--bg-primary);
        }

        .problem-info h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 6px 0;
            word-break: break-word;
        }

        .problem-info .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            font-size: 0.75rem;
        }

        /* === 题目描述滚动区：只在这里滚动 === */
        .description-scroll {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .description-scroll::-webkit-scrollbar { width: 8px; }
        .description-scroll::-webkit-scrollbar-track { background: transparent; }
        .description-scroll::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        .description-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .description-box {
            padding: 14px 18px;
        }

        .description-box h3 {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 12px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .description-content {
            color: var(--text-secondary);
            line-height: 1.7;
            font-size: 0.9rem;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .description-content p { margin: 0 0 10px 0; }
        .description-content ul, .description-content ol { margin: 10px 0; padding-left: 20px; }
        .description-content li { margin-bottom: 4px; }
        .description-content pre {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
            font-size: 0.85rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .description-content code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--accent);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        .description-content pre code {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
            border: none;
            font-size: inherit;
        }

        .example-box {
            border-top: 1px solid var(--border);
            padding: 14px 18px;
            flex-shrink: 0;
            background: var(--bg-primary);
        }

        .example-box h4 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 10px 0;
        }

        .example-box pre {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 0.85rem;
            color: var(--text-primary);
            margin: 8px 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            line-height: 1.5;
        }

        .example-box strong { color: var(--text-primary); font-weight: 600; }

        /* === 右侧代码编辑器：flex 列撑满，自身不滚动 === */
        .editor-box {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
            width: 100%;
            background: var(--bg-secondary);
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
            background: var(--bg-secondary);
        }

        .editor-header h3 {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .login-prompt {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            margin: 12px 16px;
            font-size: 0.8rem;
            color: var(--warning);
            flex: 0 0 auto;
        }
        .login-prompt a { color: var(--accent); }

        /* 编辑器滚动容器：flex 1 占满父容器全部剩余空间 */
        .editor-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            overflow: auto;
            display: flex;
            flex-direction: column;
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        /* CodeMirror 强制 width:100% height:100%，填满 wrapper，关闭横向滚动 */
        .CodeMirror {
            width: 100% !important;
            height: 100% !important;
            flex: 1 1 auto;
            overflow-x: hidden;
            font-size: 14px !important;
            font-family: 'Space Grotesk', 'Consolas', monospace !important;
            background: #1a1a1a !important;
        }

        /* 内部滚动层撑满，避免出现空白，关闭横向滚动保留纵向 */
        .CodeMirror-scroll {
            min-height: 100%;
            box-sizing: border-box;
            overflow-x: hidden !important;
        }

        /* 隐藏 CodeMirror 自带的横向滚动条 */
        .CodeMirror-hscrollbar { display: none !important; }

        .CodeMirror-gutters {
            background: var(--bg-card) !important;
            border-right: 1px solid var(--border) !important;
        }

        .CodeMirror-linenumber { color: var(--text-muted) !important; }
        .cm-s-monokai .CodeMirror-cursor { border-left: 2px solid var(--accent) !important; }
        .cm-s-monokai .CodeMirror-selected { background: rgba(139, 92, 246, 0.3) !important; }
        .cm-s-monokai .CodeMirror-focused .CodeMirror-selected { background: rgba(139, 92, 246, 0.4) !important; }
        .cm-s-monokai .cm-keyword { color: #F92672 !important; }
        .cm-s-monokai .cm-atom { color: #AE81FF !important; }
        .cm-s-monokai .cm-number { color: #AE81FF !important; }
        .cm-s-monokai .cm-def { color: #A6E22E !important; }
        .cm-s-monokai .cm-variable { color: #F8F8F2 !important; }
        .cm-s-monokai .cm-variable-2 { color: #F8F8F2 !important; }
        .cm-s-monokai .cm-variable-3 { color: #66D9EF !important; }
        .cm-s-monokai .cm-property { color: #66D9EF !important; }
        .cm-s-monokai .cm-comment { color: #75715E !important; font-style: italic; }
        .cm-s-monokai .cm-string { color: #E6DB74 !important; }
        .cm-s-monokai .cm-string-2 { color: #E6DB74 !important; }
        .cm-s-monokai .cm-operator { color: #F92672 !important; }
        .cm-s-monokai .cm-bracket { color: #F8F8F2 !important; }

        .editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            gap: 12px;
            flex: 0 0 auto;
            background: var(--bg-secondary);
        }

        .btn-submit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .draft-indicator {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .draft-indicator.saved { color: var(--success); }

        /* === 右侧测评结果面板（力扣风格，从底部向上展开） === */
        .result-panel {
            flex: 0 0 0;
            min-height: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            overflow: hidden;
            display: none;
            flex-direction: column;
        }

        .result-panel.show {
            display: flex;
            flex: 0 0 45%;
            min-height: 180px;
            max-height: 70%;
            animation: panelSlideUp 0.25s ease;
        }

        @keyframes panelSlideUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .result-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            flex: 0 0 auto;
            background: var(--bg-secondary);
        }

        .result-panel-header h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .result-panel-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            border-radius: 4px;
        }

        .result-panel-close:hover {
            color: var(--text-primary);
            background: var(--bg-input);
        }

        .result-panel-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px 16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .result-panel-body::-webkit-scrollbar { width: 8px; }
        .result-panel-body::-webkit-scrollbar-track { background: transparent; }
        .result-panel-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .result-status-badge {
            display: inline-flex;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .result-status-badge.AC { background: rgba(16, 185, 129, 0.15); color: #10B981; }
        .result-status-badge.WA { background: rgba(239, 68, 68, 0.15); color: #EF4444; }
        .result-status-badge.CE { background: rgba(139, 92, 246, 0.15); color: #8B5CF6; }
        .result-status-badge.RE { background: rgba(245, 158, 11, 0.15); color: #F59E0B; }
        .result-status-badge.TLE { background: rgba(236, 72, 153, 0.15); color: #EC4899; }
        .result-status-badge.MLE { background: rgba(14, 165, 233, 0.15); color: #0EA5E9; }

        .result-modal-meta {
            display: flex;
            gap: 16px;
            margin: 10px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .result-modal-meta-item { font-size: 0.8rem; color: var(--text-secondary); }
        .result-modal-meta-item span { color: var(--text-primary); font-weight: 600; }

        .result-modal-error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }

        .result-modal-error h4 { font-size: 0.8rem; color: #FCA5A5; margin: 0 0 6px 0; }
        .result-modal-error pre {
            background: var(--bg-card);
            border-radius: 4px;
            padding: 8px;
            font-size: 0.75rem;
            color: #FCA5A5;
            white-space: pre-wrap;
            max-height: 120px;
            overflow-y: auto;
            margin: 0;
        }

        .result-modal-tests { margin-top: 10px; }
        .result-modal-tests h4 { font-size: 0.85rem; font-weight: 600; margin: 0 0 8px 0; }

        .test-case-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 6px;
        }

        .test-case-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .test-case-card-title { font-size: 0.8rem; font-weight: 600; color: var(--text-primary); }
        .test-case-card-status { padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
        .test-case-card-status.AC { background: rgba(16, 185, 129, 0.15); color: #10B981; }
        .test-case-card-status.WA, .test-case-card-status.RE, .test-case-card-status.TLE, .test-case-card-status.MLE { background: rgba(239, 68, 68, 0.15); color: #EF4444; }

        .test-case-card-info { font-size: 0.75rem; color: var(--text-secondary); }
        .test-case-card-info span { margin-right: 12px; }

        .test-case-card-diff { margin-top: 6px; font-size: 0.75rem; }
        .test-case-card-diff pre {
            background: var(--bg-card);
            border-radius: 4px;
            padding: 6px;
            margin-top: 4px;
            white-space: pre-wrap;
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 40px 20px;
        }

        .loading-state svg { width: 40px; height: 40px; color: var(--accent); margin-bottom: 12px; animation: pulse 1.5s ease-in-out infinite; }
        .loading-state p { color: var(--text-secondary); font-size: 0.85rem; }

        .error-state { color: var(--error); }
        .error-state svg { width: 40px; height: 40px; margin-bottom: 12px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .back-link:hover { color: var(--accent); background: rgba(0, 255, 159, 0.05); }
        .back-link svg { width: 12px; height: 12px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                C++ OJ
            </a>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="index.html">首页</a>
            <a href="problem_list.html">题目</a>
            <a href="login.html">登录</a>
            <a href="register.html">注册</a>
        </div>
    </nav>

    <div class="problem-page">
        <div id="content"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        let editor = null;
        let problemId = null;
        let currentUser = null;
        let lastSubmissionId = null;
        let autoSaveTimer = null;

        const DEFAULT_CODE = `#include <iostream>
using namespace std;

int main() {
    // 你的代码
    return 0;
}`;

        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    currentUser = await response.json();
                    document.getElementById('nav-links').innerHTML = `
                        <a href="index.html">首页</a>
                        <a href="problem_list.html">题目</a>
                        <a href="submissions.html">提交</a>
                        <a href="account.html" class="nav-user-link">${currentUser.username}</a>
                        <button type="button" class="btn-logout" onclick="logout()">登出</button>
                    `;
                }
            } catch (err) {
                console.log('Not logged in');
            }
            return currentUser;
        }

        async function loadProblem() {
            const params = new URLSearchParams(window.location.search);
            problemId = params.get('problem_id') || params.get('id');
            const submissionIdParam = params.get('submission');

            if (!problemId) {
                showError('缺少题目ID参数');
                return;
            }

            if (submissionIdParam) {
                const parsed = parseInt(submissionIdParam);
                if (!isNaN(parsed) && parsed > 0) {
                    lastSubmissionId = parsed;
                }
            }

            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="loading-state" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    <p>加载题目中...</p>
                </div>
            `;

            let initialCode = null;
            let viewOnly = false;
            if (lastSubmissionId) {
                try {
                    const sub = await api.submissions.get(lastSubmissionId);
                    if (sub && !sub.error && typeof sub.code === 'string') {
                        initialCode = sub.code;
                        viewOnly = true;
                    } else if (sub && sub.error) {
                        console.warn('Failed to load submission:', sub.error);
                        lastSubmissionId = null;
                    }
                } catch (e) {
                    console.warn('Failed to load submission code', e);
                    lastSubmissionId = null;
                }
            }

            try {
                const result = await api.problems.get(problemId);
                if (result.error) {
                    showError(translateError(result.error));
                    return;
                }

                renderProblem(result, { viewOnly });
                initEditor(initialCode, viewOnly);
                if (!viewOnly) {
                    loadDraft();
                    startAutoSave();
                }
                if (lastSubmissionId) {
                    loadSubmissionResult(lastSubmissionId);
                }
            } catch (e) {
                showError(translateError(e.message));
            }
        }

        function showError(message) {
            document.getElementById('content').innerHTML = `
                <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;position:relative;">
                    <a href="problem_list.html" class="back-link" style="position:absolute;top:20px;left:20px;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        返回题目列表
                    </a>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;color:var(--error);margin-bottom:16px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p style="color:var(--text-secondary);font-size:1rem;">${escapeHtml(message)}</p>
                    <a href="problem_list.html" style="margin-top:20px;padding:10px 20px;background:var(--primary);color:white;border-radius:8px;text-decoration:none;font-weight:600;">返回题目列表</a>
                </div>
            `;
        }

        function translateError(msg) {
            if (!msg) return '未知错误';
            const map = {
                'Problem not found': '题目不存在',
                'Failed to fetch': '网络连接失败，请检查网络后重试',
                'NetworkError when attempting to fetch resource.': '网络连接失败，请检查网络后重试'
            };
            return map[msg] || msg;
        }

        function renderProblem(problem, opts = {}) {
            const viewOnly = !!opts.viewOnly;
            const difficultyClass = 'difficulty-' + problem.difficulty;
            const difficultyText = { easy: '简单', medium: '中等', hard: '困难' }[problem.difficulty] || problem.difficulty;
            const tagsHtml = (problem.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('');

            const examples = problem.examples || [];
            let examplesHtml = '';
            if (examples.length > 0) {
                examplesHtml = examples.map((ex, i) => `
                    <div class="example-box">
                        <h4>示例 ${i + 1}</h4>
                        <div><strong>输入:</strong></div>
                        <pre>${escapeHtml(ex.input || '无')}</pre>
                        <div><strong>输出:</strong></div>
                        <pre>${escapeHtml(ex.output || '无')}</pre>
                        ${ex.explanation ? `<div><strong>说明:</strong></div><pre>${escapeHtml(ex.explanation)}</pre>` : ''}
                    </div>
                `).join('');
            }

            const descriptionHtml = problem.description ? marked.parse(problem.description) : '<p>暂无描述</p>';

            const editorHeaderExtra = viewOnly
                ? `<span class="view-only-tag" style="font-size:0.7rem;color:var(--warning);background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.3);padding:2px 8px;border-radius:4px;margin-left:8px;">查看历史提交（只读）</span>`
                : '';

            document.getElementById('content').innerHTML = `
                <div class="problem-detail">
                    <div class="problem-left">
                        <div class="problem-info">
                            <h2>${escapeHtml(problem.title)}</h2>
                            <div class="meta">
                                <span class="difficulty ${difficultyClass}">${difficultyText}</span>
                                ${tagsHtml}
                                <span style="color:var(--text-muted);font-size:0.75rem;">时间限制: ${problem.time_limit_ms || 1000}ms | 内存限制: ${problem.memory_limit_mb || 256}MB</span>
                            </div>
                        </div>
                        <div class="description-scroll" id="description-scroll">
                            <div class="description-box">
                                <h3>题目描述</h3>
                                <div class="description-content">${descriptionHtml}</div>
                            </div>
                            ${examplesHtml}
                        </div>
                    </div>
                    <div class="problem-right">
                        <div class="editor-box">
                            <div class="editor-header">
                                <h3 style="display:flex;align-items:center;">代码编辑器${editorHeaderExtra}</h3>
                                <span style="font-size:0.75rem;color:var(--text-muted);">C++ (g++ -O2)</span>
                            </div>
                            ${(!currentUser && !viewOnly) ? `
                                <div class="login-prompt">
                                    您当前未登录，可自由编辑代码；点击提交将跳转登录。<a href="login.html?redirect=${encodeURIComponent(window.location.href)}">立即登录</a>
                                </div>
                            ` : ''}
                            <div class="editor-wrapper">
                                <textarea id="code-editor"></textarea>
                            </div>
                            <div class="editor-footer">
                                <div class="draft-indicator" id="draft-indicator" ${viewOnly ? 'style="visibility:hidden;"' : ''}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;">
                                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                        <polyline points="7 3 7 8 15 8"></polyline>
                                    </svg>
                                    <span id="draft-text">草稿已保存</span>
                                </div>
                                <button class="btn-submit" id="submit-btn" onclick="submitCode()" ${viewOnly ? 'style="display:none;"' : ''}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                                    </svg>
                                    ${currentUser ? '提交代码' : '登录后提交'}
                                </button>
                            </div>
                        </div>
                        <div class="result-panel" id="result-panel">
                            <div class="result-panel-header">
                                <h3>${viewOnly ? '历史提交评测结果' : '评测结果'}</h3>
                                <button class="result-panel-close" onclick="closeResultPanel()" aria-label="收起结果面板">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;">
                                        <line x1="18" y1="6" x2="6" y2="18"></line>
                                        <line x1="6" y1="6" x2="18" y2="18"></line>
                                    </svg>
                                </button>
                            </div>
                            <div class="result-panel-body" id="result-panel-body"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function initEditor(initialCode, viewOnly) {
            const code = (initialCode !== null && initialCode !== undefined) ? initialCode : DEFAULT_CODE;
            editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
                mode: "text/x-c++src",
                theme: "monokai",
                lineNumbers: true,
                matchBrackets: true,
                indentUnit: 4,
                tabSize: 4,
                indentWithTabs: false,
                lineWrapping: true,
                autofocus: !viewOnly,
                readOnly: !!viewOnly
            });

            editor.setValue(code, -1);

            if (!viewOnly) {
                let pristine = true;
                editor.on('change', () => { pristine = false; });
                editor.on('focus', () => {
                    if (pristine) {
                        editor.execCommand('selectAll');
                    }
                });
            }
        }

        function getEditorValue() {
            return editor ? editor.getValue() : '';
        }

        function setEditorValue(code) {
            if (editor) {
                editor.setValue(code, -1);
            }
        }

        function getDraftKey() {
            return `oj_draft_${problemId}`;
        }

        function loadDraft() {
            if (!editor) return;
            const draft = localStorage.getItem(getDraftKey());
            if (draft) {
                setEditorValue(draft);
            } else {
                setEditorValue(DEFAULT_CODE);
            }
        }

        function saveDraft() {
            if (!editor) return;
            const code = getEditorValue();
            localStorage.setItem(getDraftKey(), code);
            showDraftStatus('已保存 ' + new Date().toLocaleTimeString(), true);
        }

        function clearDraft() {
            localStorage.removeItem(getDraftKey());
        }

        function startAutoSave() {
            if (autoSaveTimer) clearInterval(autoSaveTimer);
            autoSaveTimer = setInterval(saveDraft, 30000);
        }

        function showDraftStatus(text, saved = false) {
            const indicator = document.getElementById('draft-indicator');
            const draftText = document.getElementById('draft-text');
            if (indicator && draftText) {
                draftText.textContent = text;
                indicator.className = 'draft-indicator' + (saved ? ' saved' : '');
            }
        }

        async function submitCode() {
            if (!editor) return;

            if (!currentUser) {
                window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
                return;
            }

            const code = getEditorValue().trim();
            if (!code) {
                alert('请输入代码');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;animation:spin 1s linear infinite;">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
                    <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1"/>
                </svg> 提交中...
            `;

            try {
                const result = await api.submissions.create({
                    problem_id: parseInt(problemId),
                    code: code,
                    language: 'cpp'
                });

                if (result.error) {
                    alert(result.error);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        提交代码
                    `;
                    return;
                }

                clearDraft();
                lastSubmissionId = result.id;
                await loadSubmissionResult(result.id);
            } catch (e) {
                alert('提交失败: ' + e.message);
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                提交代码
            `;
        }

        let submissionPollInterval = null;

        function refreshEditor() {
            if (editor) {
                requestAnimationFrame(() => editor.refresh());
            }
        }

        function openResultPanel() {
            const panel = document.getElementById('result-panel');
            if (panel && !panel.classList.contains('show')) {
                panel.classList.add('show');
                refreshEditor();
            }
        }

        function closeResultPanel() {
            const panel = document.getElementById('result-panel');
            if (panel) {
                panel.classList.remove('show');
                refreshEditor();
            }
            if (submissionPollInterval) {
                clearInterval(submissionPollInterval);
                submissionPollInterval = null;
            }
        }

        async function loadSubmissionResult(submissionId) {
            const panelBody = document.getElementById('result-panel-body');
            if (!panelBody) return;

            if (submissionPollInterval) {
                clearInterval(submissionPollInterval);
                submissionPollInterval = null;
            }

            openResultPanel();
            panelBody.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-secondary);">加载结果中...</div>';

            async function pollResult() {
                try {
                    const result = await api.submissions.get(submissionId);
                    if (result.error) {
                        panelBody.innerHTML = '<div style="text-align:center;padding:30px;color:var(--error);">加载失败: ' + escapeHtml(result.error) + '</div>';
                        if (submissionPollInterval) {
                            clearInterval(submissionPollInterval);
                            submissionPollInterval = null;
                        }
                        return;
                    }

                    if (result.queue_status === 'completed' || (result.status !== 'pending' && result.status !== 'queued')) {
                        renderResultPanel(result);
                        if (submissionPollInterval) {
                            clearInterval(submissionPollInterval);
                            submissionPollInterval = null;
                        }
                    } else {
                        panelBody.innerHTML = `
                            <div style="text-align:center;padding:30px;">
                                <div style="color:var(--text-secondary);margin-bottom:12px;">正在等待判题队列处理，请稍候...</div>
                                <div style="font-size:0.85rem;color:var(--text-muted);">状态: ${result.status} / ${result.queue_status}</div>
                            </div>
                        `;
                    }
                } catch (e) {
                    panelBody.innerHTML = '<div style="text-align:center;padding:30px;color:var(--error);">加载失败: ' + escapeHtml(e.message) + '</div>';
                    if (submissionPollInterval) {
                        clearInterval(submissionPollInterval);
                        submissionPollInterval = null;
                    }
                }
            }

            await pollResult();
            submissionPollInterval = setInterval(pollResult, 2000);
        }

        function renderResultPanel(submission) {
            const panelBody = document.getElementById('result-panel-body');
            if (!panelBody) return;

            const statusText = {
                'AC': '答案正确', 'WA': '答案错误', 'CE': '编译错误',
                'RE': '运行时错误', 'TLE': '超时', 'MLE': '内存超限',
                'OLE': '输出超限', 'PE': '格式错误'
            }[submission.status] || submission.status;

            let errorHtml = '';
            if (submission.error_detail) {
                errorHtml = `
                    <div class="result-modal-error">
                        <h4>错误详情</h4>
                        <pre>${escapeHtml(submission.error_detail)}</pre>
                    </div>
                `;
            }

            let testsHtml = '';
            if (submission.results && submission.results.length > 0) {
                const passed = submission.results.filter(r => r.status === 'AC').length;
                const total = submission.results.length;
                testsHtml = `
                    <div class="result-modal-tests">
                        <h4>测试点结果 (${passed}/${total})</h4>
                        ${submission.results.map((r, i) => `
                            <div class="test-case-card">
                                <div class="test-case-card-header">
                                    <span class="test-case-card-title">测试点 ${i + 1}</span>
                                    <span class="test-case-card-status ${r.status}">${r.status}</span>
                                </div>
                                <div class="test-case-card-info">
                                    <span>执行时间: ${r.execute_time_ms || 0}ms</span>
                                    <span>内存: ${r.execute_memory_kb || 0}KB</span>
                                </div>
                                ${r.status !== 'AC' && (r.expected_output || r.actual_output) ? `
                                    <div class="test-case-card-diff">
                                        ${r.expected_output ? `<div style="color:var(--text-secondary);">期望输出:</div><pre>${escapeHtml(r.expected_output)}</pre>` : ''}
                                        <div style="color:var(--text-secondary);margin-top:6px;">实际输出:</div>
                                        <pre>${escapeHtml(r.actual_output || '(空)')}</pre>
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            panelBody.innerHTML = `
                <div style="text-align:center;margin-bottom:16px;">
                    <span class="result-status-badge ${submission.status}">${submission.status} - ${statusText}</span>
                </div>
                <div class="result-modal-meta">
                    <div class="result-modal-meta-item">执行时间: <span>${submission.execute_time_ms || 0}ms</span></div>
                    <div class="result-modal-meta-item">内存占用: <span>${submission.execute_memory_kb || 0}KB</span></div>
                    <div class="result-modal-meta-item">提交时间: <span>${formatTime(submission.created_at)}</span></div>
                </div>
                ${errorHtml}
                ${testsHtml}
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const d = new Date(timeStr);
            return d.toLocaleString('zh-CN');
        }

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (editor) {
                    saveDraft();
                }
            }
        });

        checkAuth().then(() => loadProblem());

        const style = document.createElement('style');
        style.textContent = '@keyframes spin { to { transform: rotate(360deg); } } .spinner { animation: spin 1s linear infinite; }';
        document.head.appendChild(style);
    </script>
</body>
</html>
