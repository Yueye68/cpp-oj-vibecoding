<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ OJ System - 在线编程评测平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                C++ OJ
            </a>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="index.html" class="active">首页</a>
            <a href="problems.html">题目</a>
            <a href="login.html">登录</a>
            <a href="register.html">注册</a>
        </div>
    </nav>

    <div class="container">
        <div style="text-align: center; padding: 80px 20px;">
            <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 3rem; margin-bottom: 16px;">
                <span style="color: var(--accent);">C++</span> 在线评测系统
            </h1>
            <p style="color: var(--text-secondary); font-size: 1.2rem; max-width: 600px; margin: 0 auto 40px;">
                专业的编程题目评测平台，支持算法与数据结构训练，助力提升编程能力
            </p>
            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                <a href="problems.html" class="btn btn-primary" style="padding: 14px 32px; font-size: 1rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    开始刷题
                </a>
                <a href="register.html" class="btn" style="padding: 14px 32px; font-size: 1rem; background: transparent; border: 1px solid var(--border); color: var(--text-primary);">
                    立即注册
                </a>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 60px;">
            <div class="problem-card" style="text-align: center; cursor: default;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;color:var(--accent);margin-bottom:16px;">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <h3 style="margin-bottom:8px;color:var(--text-primary);">C++ 编程</h3>
                <p style="color:var(--text-secondary);font-size:0.9rem;">支持标准 C++ 编译运行，专业评测引擎</p>
            </div>
            <div class="problem-card" style="text-align: center; cursor: default;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;color:var(--primary);margin-bottom:16px;">
                    <path d="M12 20V10"></path>
                    <path d="M18 20V4"></path>
                    <path d="M6 20v-4"></path>
                </svg>
                <h3 style="margin-bottom:8px;color:var(--text-primary);">海量题库</h3>
                <p style="color:var(--text-secondary);font-size:0.9rem;">涵盖算法与数据结构的精选题目</p>
            </div>
            <div class="problem-card" style="text-align: center; cursor: default;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;color:var(--secondary);margin-bottom:16px;">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <h3 style="margin-bottom:8px;color:var(--text-primary);">即时评测</h3>
                <p style="color:var(--text-secondary);font-size:0.9rem;">快速返回评测结果，详细错误分析</p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 C++ OJ System. All rights reserved.</p>
    </footer>

    <script>
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    const user = await response.json();
                    let adminLink = '';
                    if (user.role === 'admin') {
                        adminLink = '<a href="admin/problems.html">题目管理</a>';
                    }
                    document.getElementById('nav-links').innerHTML = `
                        <a href="index.html">首页</a>
                        <a href="problems.html">题目</a>
                        <a href="submissions.html">提交</a>
                        ${adminLink}
                        <span>${user.username}</span>
                        <a href="/logout.html" class="btn-logout">登出</a>
                    `;
                }
            } catch (err) {
                console.log('Not logged in');
            }
        }
        checkAuth();
    </script>
</body>
</html>
