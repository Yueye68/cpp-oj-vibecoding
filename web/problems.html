<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题目列表 - C++ OJ</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                C++ OJ
            </a>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="index.html">首页</a>
            <a href="problems.html" class="active">题目</a>
            <a href="login.html">登录</a>
            <a href="register.html">注册</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>题目列表</h1>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>难度:</label>
                <div class="filter-buttons">
                    <button class="difficulty-btn active" data-difficulty="" onclick="setDifficultyFilter('')">全部</button>
                    <button class="difficulty-btn" data-difficulty="easy" onclick="setDifficultyFilter('easy')">简单</button>
                    <button class="difficulty-btn" data-difficulty="medium" onclick="setDifficultyFilter('medium')">中等</button>
                    <button class="difficulty-btn" data-difficulty="hard" onclick="setDifficultyFilter('hard')">困难</button>
                </div>
            </div>

            <div class="filter-group">
                <label>分类:</label>
                <div class="filter-buttons" id="tags-filter"></div>
            </div>

            <div class="filter-group search-group">
                <label>搜索:</label>
                <input type="text" id="search-input" placeholder="按标题搜索...">
                <button onclick="handleSearch()">搜索</button>
            </div>
        </div>

        <div id="problems-container"></div>
        <div id="pagination" class="pagination"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/problems.js"></script>
    <script>
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    const user = await response.json();
                    let adminLink = '';
                    if (user.role === 'admin') {
                        adminLink = '<a href="admin/problems.html">题目管理</a>';
                    }
                    document.getElementById('nav-links').innerHTML = `
                        <a href="index.html">首页</a>
                        <a href="problems.html" class="active">题目</a>
                        <a href="submissions.html">提交</a>
                        ${adminLink}
                        <span>${user.username}</span>
                        <a href="/logout.html" class="btn-logout">登出</a>
                    `;
                }
            } catch (err) {
                console.log('Not logged in');
            }
        }
        checkAuth();
        initProblemsPage();
    </script>
</body>
</html>
